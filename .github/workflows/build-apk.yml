name: Build APK

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Firebase config (from the repository secret)
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "::error::Add the GOOGLE_SERVICES_JSON_B64 secret (see README)."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json

      - name: Build
        env:
          SERVER_URL: ${{ vars.SERVER_URL }}
        run: |
          if [ -n "$SERVER_URL" ]; then
            gradle assembleDebug --no-daemon -PSERVER_URL="$SERVER_URL"
          else
            gradle assembleDebug --no-daemon
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ajyad-admin-apk
          path: app/build/outputs/apk/debug/app-debug.apk
